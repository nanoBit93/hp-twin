# Home-Assistant-Add-on: hp-twin (Wärmepumpen-Lastprognose für EOS Connect)
name: hp-twin Wärmepumpen-Zwilling
version: "0.1.0"
slug: hp_twin
description: >-
  Zustandsbasierte 48-h-Lastprognose der Wärmepumpe (Monte-Carlo) mit
  Troubleshooting-Dashboard und EOS-Connect-Ausgabe.
url: https://github.com/nanoBit93/hp-twin
arch: [aarch64, amd64, armv7]
init: false
# Ingress: Dashboard erscheint in der HA-Seitenleiste
ingress: true
ingress_port: 8000
panel_icon: mdi:heat-pump
panel_title: hp-twin
# Zugriff auf die HA-Core-API (Sensoren lesen) über den Supervisor-Proxy
homeassistant_api: true
# Zusätzliche Ports optional (für direkten Zugriff ohne Ingress)
ports:
  8000/tcp: null
ports_description:
  8000/tcp: hp-twin API/Dashboard (optional, ohne Ingress)
# Persistente Konfig/Daten
map:
  - config:rw
  - share:rw
options:
  topology: config/example_topology.yaml
  model: config/model.yaml
  export_days: 10
  forecast_runs: 100
  horizon_h: 48
  dhw_setpoint_cap_c: 45
  eos_base_url: ""
  eos_managed_load_id: ""
  log_level: info
schema:
  topology: str
  model: str
  export_days: int(1,60)
  forecast_runs: int(1,500)
  horizon_h: float(1,48)
  dhw_setpoint_cap_c: "float?"
  eos_base_url: str?
  eos_managed_load_id: str?
  log_level: list(trace|debug|info|warning|error)?
